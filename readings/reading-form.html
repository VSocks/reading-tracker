<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Readings</title>
    <script type="module" src="./reading-form.js"></script>
</head>

<body>
    <h2>Readings</h2>
    <form id="reading-form">
        <label for="reading-book">Book</label>
        <select id="reading-book" required>
            <option value="">Not specified</option>
        </select>

        <label for="reading-status">Status</label>
        <select id="reading-status" required>
            <option value="Want to Read">Want to read</option>
            <option value="Reading">Reading</option>
            <option value="Paused">Paused</option>
            <option value="Read">Read</option>
            <option value="Abandoned">Abandoned</option>
        </select>

        <label for="year-read">Year Read</label>
        <input type="number" id="year-read" hidden>

        <label for="grade">Grade</label>
        <input type="number" id="grade" min="0" max="10" step="0.5">

        <label for="recommended-by">Recommended By</label>
        <input type="text" id="recommended-by">

        <label for="priority">Priority</label>
        <select id="priority" hidden>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <label for="notes">Notes</label>
        <textarea id="notes"></textarea>

        <button id="add-reading" type="submit">Add reading</button>
        <button id="cancel-button-reading" type="button">Cancel</button>
</body>

</html>

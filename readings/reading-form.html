<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Readings</title>
    <script type="module" src="./reading-form.js"></script>
</head>

<body>
    <a href="./readings.html">Back</a>
    <h2>Readings</h2>
    <form id="reading-form">
        <label for="reading-book">Book</label>
        <select id="reading-book" required>
            <option value=""></option>
        </select>
        <br>

        <label for="reading-status">Status</label>
        <select id="reading-status" required>
            <option value =""></option>
            <option value="Want to read">Want to read</option>
            <option value="Reading">Reading</option>
            <option value="Paused">Paused</option>
            <option value="Read">Read</option>
            <option value="Abandoned">Abandoned</option>
        </select>
        <br>

        <div id="year-read-section" hidden>
            <label for="year-read">Year Read</label>
            <input type="number" id="year-read">
        </div>
        <br>

        <label for="grade">Grade</label>
        <input type="number" id="grade" min="0" max="10" step="0.5">
        <br>

        <label for="recommended-by">Recommended By</label>
        <input type="text" id="recommended-by">
        <br>

        <div id="priority-section" hidden>
            <label for="priority">Priority</label>
            <select id="priority">
                <option value =""></option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>
        <br>

        <label for="notes">Notes</label>
        <textarea id="notes"></textarea>
        <br>

        <button id="submit-reading" type="submit">Add reading</button>
        <button id="cancel-button-reading" type="button">Cancel</button>
    </form>
</body>

</html>

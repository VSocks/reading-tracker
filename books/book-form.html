<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
    <script type="module" src="./books-form.js"></script>
</head>

<body>
    <a href="./books.html">Back</a>
    <h2>Books</h2>
    <form id="book-form">
        <label for="book-title">Title</label>
        <input type="text" id="book-title">

        <label for="book-author">Author</label>
        <select multiple id="book-author">
            <option value="">Not Specified</option>
        </select>

        <label for="publication-year">Publication Year</label>
        <input type="number" id="publication-year" />

        <label for="form">Form</label>
        <select id="form">
            <option value="Novel">Novel</option>
            <option value="Novella">Novella</option>
            <option value="Short Story">Short Story</option>
            <option value="Short Story Collection">Short Story Collection</option>
            <option value="Play">Play</option>
            <option value="Essay">Essay</option>
            <option value="Treatise">Treatise</option>
            <option value="Diary">Diary</option>
            <option value="Graphic Novel">Graphic Novel</option>
        </select>

        <label for="mode-of-expression">Mode of Expression</label>
        <select id="mode-of-expression">
            <option value="Prose">Prose</option>
            <option value="Drama">Drama</option>
            <option value="Poetry">Poetry</option>
            <option value="Sequential Art">Sequential Art</option>
        </select>

        <label for="content">Content</label>
        <select id="content">
            <option value="Fiction">Fiction</option>
            <option value="Non-fiction">Non-Fiction</option>
        </select>

        <label for="themes-input">Themes</label>
        <div id="themes-input">
            <input type="text" id="tag-input" />
            <ul id="selected-tags"></ul>
        </div>
        <button id="add-new-theme" type="button">Add New Theme</button>
        <ul id="themes-suggestions"></ul>

        <button id="add-book" type="submit">Add book</button>
        <button id="cancel-button-book" type="button">Cancel</button>
    </form>
</body>

</html>
